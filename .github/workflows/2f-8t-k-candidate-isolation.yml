# -*- coding: utf-8 -*-
name: 2F-8T-K real WebEngine candidate isolation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        candidate:
          - id: cross-route
            path: tests/test_cross_route_physical_resource_exclusivity.py
          - id: lifecycle
            path: tests/test_physical_lifecycle_reconciliation.py
          - id: services-core
            path: tests/test_services_web_queue.py
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --headless --disable-gpu --disable-software-rasterizer
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v6
        with:
          ref: diagnostic/2f-8t-qwebengine-clean
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"

      - name: Install Linux Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libglvnd0 \
            libx11-xcb1 \
            libxcb1 \
            libxcb-cursor0 \
            libxkbcommon0 \
            libxkbcommon-x11-0

      - name: Install runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "PySide6==6.11.2" \
            tzdata \
            playwright \
            python-dotenv \
            SQLAlchemy \
            pytest

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run candidate plus target in fresh processes
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          target='tests/test_webchat_runtime_controlled_8h.py::WebChatRuntimeControlledTests'

          for run in 1 2 3; do
            log="artifacts/candidate-$run.log"
            echo "===== CANDIDATE $run =====" | tee "$log"
            python -m pytest -q -vv \
              "${{ matrix.candidate.path }}" \
              "$target" >>"$log" 2>&1
            code=$?
            echo "PROCESS_EXIT_CODE=$code" | tee -a "$log"
          done

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2f-8t-k-${{ matrix.candidate.id }}
          path: artifacts/
          if-no-files-found: error
