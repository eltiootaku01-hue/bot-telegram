name: Keep main as canonical branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Delete non-main branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          git fetch --prune origin
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            [ "$branch" = "main" ] && continue
            echo "Deleting remote branch: $branch"
            git push origin --delete "$branch" || echo "Could not delete $branch (protected or already gone)."
          done < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin/ | grep -v '^HEAD$')
