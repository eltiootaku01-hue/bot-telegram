name: Build Windows desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compile source
        shell: pwsh
        run: python -m compileall -q src launcher.py desktop.py

      - name: Build BOT-IA executables
        shell: pwsh
        run: .\build_desktop.ps1

      - name: Smoke test BOT-IA-Core
        shell: pwsh
        run: |
          $core = Start-Process -FilePath "$PWD\release\BOT-IA-Core.exe" -WorkingDirectory "$PWD\release" -PassThru
          try {
            Start-Sleep -Seconds 5
            $core.Refresh()
            if ($core.HasExited) {
              throw "BOT-IA-Core.exe exited during the 5-second startup smoke test (code $($core.ExitCode))."
            }
            Write-Host "OK: BOT-IA-Core.exe remained running for the startup smoke test (PID $($core.Id))."
          }
          finally {
            $core.Refresh()
            if (-not $core.HasExited) {
              Stop-Process -Id $core.Id -Force -ErrorAction SilentlyContinue
              $core.WaitForExit()
            }
          }

      - name: Smoke test BOT-IA launcher
        shell: pwsh
        run: |
          @"
          BOT_IA_UNIVERSE=one_neko_punch
          BOT_IA_PROVIDER=openai
          BOT_IA_ONE_NEKO_PUNCH_ROOT=$PWD\release\biblioteca
          OPENAI_API_KEY=
          GROQ_API_KEY=
          OPENROUTER_API_KEY=
          TELEGRAM_BOT_TOKEN=
          "@ | Set-Content -Path "$PWD\release\.env" -Encoding utf8
          $launcher = Start-Process -FilePath "$PWD\release\BOT-IA.exe" -WorkingDirectory "$PWD\release" -PassThru
          Start-Sleep -Seconds 3
          $launcher.Refresh()
          if (-not $launcher.HasExited) {
            Stop-Process -Id $launcher.Id -Force -ErrorAction SilentlyContinue
            throw "BOT-IA.exe did not hand off control to the Core/Setup flow within 3 seconds."
          }
          $coreProcesses = Get-Process -Name "BOT-IA-Core" -ErrorAction SilentlyContinue
          if (-not $coreProcesses) {
            throw "BOT-IA.exe exited but did not start BOT-IA-Core.exe during the launcher smoke test."
          }
          Write-Host "OK: BOT-IA.exe started BOT-IA-Core.exe."
          $coreProcesses | Stop-Process -Force -ErrorAction SilentlyContinue
          Remove-Item "$PWD\release\.env" -Force -ErrorAction SilentlyContinue

      - name: Build Windows installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Verify Windows package
        shell: pwsh
        run: |
          $required = @(
            "release\BOT-IA.exe",
            "release\BOT-IA-Core.exe",
            "release\BOT-IA-Setup.exe"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Missing required package file: $path"
            }
            $size = (Get-Item $path).Length
            if ($size -le 100KB) {
              throw "Package file is unexpectedly small: $path ($size bytes)"
            }
            Write-Host "OK: $path ($size bytes)"
          }
          if (-not (Test-Path "release\config" -PathType Container)) {
            throw "Missing required package directory: release\config"
          }
          $core = Get-Item "release\BOT-IA-Core.exe"
          $launcher = Get-Item "release\BOT-IA.exe"
          $installer = Get-Item "release\BOT-IA-Setup.exe"
          Write-Host "Launcher/Core/Installer verified: $($launcher.Length) / $($core.Length) / $($installer.Length) bytes"

      - name: Upload desktop package
        uses: actions/upload-artifact@v6
        with:
          name: BOT-IA-Windows
          path: release/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
