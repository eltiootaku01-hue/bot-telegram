name: Build Windows desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compile source
        shell: pwsh
        run: python -m compileall -q src launcher.py desktop.py

      - name: Build BOT-IA executables
        shell: pwsh
        run: .\build_desktop.ps1

      - name: Build Windows installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Upload desktop package
        uses: actions/upload-artifact@v6
        with:
          name: BOT-IA-Windows
          path: release/
          if-no-files-found: error
