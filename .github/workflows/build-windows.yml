name: Build Windows desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compile source
        shell: pwsh
        run: python -m compileall -q src launcher.py desktop.py desktop_entry.py

      - name: Build BOT-IA executables
        shell: pwsh
        run: .\build_desktop.ps1

      - name: Smoke test BOT-IA-Core
        shell: pwsh
        run: |
          $core = Start-Process -FilePath "$PWD\release\BOT-IA-Core.exe" -WorkingDirectory "$PWD\release" -PassThru
          try {
            Start-Sleep -Seconds 5
            $core.Refresh()
            if ($core.HasExited) {
              throw "BOT-IA-Core.exe exited during the 5-second startup smoke test (code $($core.ExitCode))."
            }
            Write-Host "OK: BOT-IA-Core.exe remained running for the startup smoke test (PID $($core.Id))."
          }
          finally {
            $core.Refresh()
            if (-not $core.HasExited) {
              Stop-Process -Id $core.Id -Force -ErrorAction SilentlyContinue
              $core.WaitForExit()
            }
          }

      - name: Smoke test BOT-IA launcher
        shell: pwsh
        run: |
          @"
          BOT_IA_UNIVERSE=one_neko_punch
          BOT_IA_PROVIDER=openai
          BOT_IA_ONE_NEKO_PUNCH_ROOT=$PWD\release\biblioteca
          OPENAI_API_KEY=
          GROQ_API_KEY=
          OPENROUTER_API_KEY=
          TELEGRAM_BOT_TOKEN=
          "@ | Set-Content -Path "$PWD\release\.env" -Encoding utf8

          $sourceIdentifier = "BOTIA-LauncherStart-$([guid]::NewGuid().ToString('N'))"
          $subscription = $null
          $launcher = $null
          $p1Pid = $null
          $p1Time = $null
          $p2Pid = $null
          $p2Time = $null
          $handoffObserved = $false
          $deadlineSeconds = 10
          $launcherPath = [System.IO.Path]::GetFullPath("$PWD\release\BOT-IA.exe")
          $corePath = [System.IO.Path]::GetFullPath("$PWD\release\BOT-IA-Core.exe")

          function Stop-CorrelatedProcess {
            param(
              [int]$ProcessId,
              [string]$ExpectedName,
              [string]$ExpectedPath,
              [DateTime]$ExpectedCreationTimeUtc
            )

            if ($ProcessId -le 0) {
              return
            }

            $process = Get-CimInstance -ClassName Win32_Process -Filter "ProcessId = $ProcessId" -ErrorAction SilentlyContinue
            if ($null -eq $process) {
              return
            }

            if ($process.Name -ne $ExpectedName) {
              return
            }

            if ($process.ExecutablePath -and (-not [string]::Equals([System.IO.Path]::GetFullPath($process.ExecutablePath), $ExpectedPath, [System.StringComparison]::OrdinalIgnoreCase))) {
              return
            }

            if ($process.CreationDate) {
              $actualCreationTimeUtc = $process.CreationDate.ToUniversalTime()
              if ([math]::Abs(($actualCreationTimeUtc - $ExpectedCreationTimeUtc).TotalSeconds) -gt 2) {
                return
              }
            }

            Stop-Process -Id $ProcessId -Force -ErrorAction SilentlyContinue
          }

          try {
            try {
              $subscription = Register-CimIndicationEvent -ClassName "Win32_ProcessStartTrace" -Namespace "root/cimv2" -SourceIdentifier $sourceIdentifier -ErrorAction Stop
            }
            catch {
              throw "Unable to subscribe to Win32_ProcessStartTrace: $($_.Exception.Message)"
            }

            $activeSubscription = Get-EventSubscriber -SourceIdentifier $sourceIdentifier -ErrorAction SilentlyContinue
            if ($null -eq $activeSubscription) {
              throw "Win32_ProcessStartTrace subscription was not active after registration."
            }

            $p0LaunchReference = [DateTime]::UtcNow
            $launcher = Start-Process -FilePath "$PWD\release\BOT-IA.exe" -WorkingDirectory "$PWD\release" -PassThru

            $p0Pid = [int]$launcher.Id
            $p0Time = $p0LaunchReference
            try {
              $p0Time = $launcher.StartTime.ToUniversalTime()
            }
            catch {
              Write-Host "Launcher P0 start time query unavailable; using launch reference."
            }

            Write-Host "Launcher P0 PID = $p0Pid"

            $deadlineAt = $p0LaunchReference.AddSeconds($deadlineSeconds)

            while (-not $handoffObserved) {
              $remainingSeconds = ($deadlineAt - [DateTime]::UtcNow).TotalSeconds
              if ($remainingSeconds -le 0) {
                break
              }

              $waitSeconds = [Math]::Max(1, [Math]::Floor($remainingSeconds))
              $eventRecord = Wait-Event -SourceIdentifier $sourceIdentifier -Timeout $waitSeconds
              $eventReceivedAtUtc = [DateTime]::UtcNow
              if ($null -eq $eventRecord) {
                if ($eventReceivedAtUtc -ge $deadlineAt) {
                  break
                }
                continue
              }

              if ($eventReceivedAtUtc -ge $deadlineAt) {
                break
              }

              try {
                $processEvent = $eventRecord.SourceEventArgs.NewEvent
                $processName = [string]$processEvent.ProcessName
              $processId = [int]$processEvent.ProcessID
              $parentProcessId = [int]$processEvent.ParentProcessID
              $processTime = [DateTime]::FromFileTimeUtc([int64]$processEvent.TIME_CREATED)

              if ($null -eq $p1Pid -and $processName -eq "BOT-IA.exe" -and $processId -ne $p0Pid -and $parentProcessId -eq $p0Pid -and $processTime -ge $p0Time) {
                $p1Pid = $processId
                $p1Time = $processTime
                Write-Host "P1 detected PID = $p1Pid"
                Write-Host "P1 parent PID = $parentProcessId"
              }

                if ($null -ne $p1Pid -and $processName -eq "BOT-IA-Core.exe" -and $parentProcessId -eq $p1Pid -and $processTime -ge $p1Time -and $processTime -le $deadlineAt) {
                  $p2DeadlineCheckUtc = [DateTime]::UtcNow
                  if ($p2DeadlineCheckUtc -lt $deadlineAt) {
                    $p2Pid = $processId
                    $p2Time = $processTime
                    $handoffObserved = $true
                    Write-Host "P2 detected PID = $p2Pid"
                    Write-Host "P2 parent PID = $parentProcessId"
                  }
                }
              }
              finally {
                Remove-Event -EventIdentifier $eventRecord.EventIdentifier -ErrorAction SilentlyContinue
              }
            }

            if (-not $handoffObserved) {
              $elapsed = ([DateTime]::UtcNow - $p0LaunchReference).TotalSeconds
              throw "BOT-IA.exe launcher handoff was not correlated within $($deadlineSeconds)s: no valid P0 -> P1 -> P2 process chain observed (elapsed $([math]::Round($elapsed, 3)) s)."
            }

            if ([DateTime]::UtcNow -ge $deadlineAt) {
              throw "BOT-IA.exe launcher handoff correlation exceeded the strict $($deadlineSeconds)s deadline before PASS."
            }

            if ($p1Time -lt $p0Time -or $p2Time -lt $p1Time) {
              throw "Invalid process creation ordering for P0 -> P1 -> P2."
            }

            $elapsed = ($p2Time - $p0LaunchReference).TotalSeconds
            Write-Host "OK: BOT-IA launcher handoff observed."
            Write-Host "P0 PID = $p0Pid"
            Write-Host "P1 PID = $p1Pid"
            Write-Host "P2 PID = $p2Pid"
            Write-Host ("OK: launcher handoff observed in {0:N3} s." -f $elapsed)
          }
          catch {
            throw
          }
          finally {
            if ($p2Pid) {
              Stop-CorrelatedProcess -ProcessId $p2Pid -ExpectedName "BOT-IA-Core.exe" -ExpectedPath $corePath -ExpectedCreationTimeUtc $p2Time
            }

            if ($p1Pid) {
              Stop-CorrelatedProcess -ProcessId $p1Pid -ExpectedName "BOT-IA.exe" -ExpectedPath $launcherPath -ExpectedCreationTimeUtc $p1Time
            }

            if ($launcher) {
              try {
                $launcher.Refresh()
                if (-not $launcher.HasExited) {
                  Stop-Process -Id $p0Pid -Force -ErrorAction SilentlyContinue
                  $launcher.WaitForExit()
                }
              }
              catch {
                Write-Host "Launcher cleanup could not confirm P0 termination: $($_.Exception.Message)"
              }
            }

            if ($sourceIdentifier) {
              Get-Event -SourceIdentifier $sourceIdentifier -ErrorAction SilentlyContinue | Remove-Event -ErrorAction SilentlyContinue
              Unregister-Event -SourceIdentifier $sourceIdentifier -ErrorAction SilentlyContinue
              Get-Job -Name $sourceIdentifier -ErrorAction SilentlyContinue | Remove-Job -Force -ErrorAction SilentlyContinue
            }

            Remove-Item "$PWD\release\.env" -Force -ErrorAction SilentlyContinue
          }

      - name: Clean generated runtime state
        shell: pwsh
        run: |
          Remove-Item "$PWD\release\.env" -Force -ErrorAction SilentlyContinue
          Remove-Item "$PWD\release\work" -Recurse -Force -ErrorAction SilentlyContinue
          if (Test-Path "$PWD\release\work") {
            throw "Generated runtime state was not removed from the release package."
          }

      - name: Build Windows installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Verify Windows package
        shell: pwsh
        run: |
          $required = @(
            "release\BOT-IA.exe",
            "release\BOT-IA-Core.exe",
            "release\BOT-IA-Setup.exe"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Missing required package file: $path"
            }
            $size = (Get-Item $path).Length
            if ($size -le 100KB) {
              throw "Package file is unexpectedly small: $path ($size bytes)"
            }
            Write-Host "OK: $path ($size bytes)"
          }
          if (-not (Test-Path "release\config" -PathType Container)) {
            throw "Missing required package directory: release\config"
          }
          if (Test-Path "release\work") {
            throw "Release package must not contain generated runtime state: release\work"
          }
          if (Test-Path "release\.env") {
            throw "Release package must not contain local secrets/config: release\.env"
          }
          $core = Get-Item "release\BOT-IA-Core.exe"
          $launcher = Get-Item "release\BOT-IA.exe"
          $installer = Get-Item "release\BOT-IA-Setup.exe"
          Write-Host "Launcher/Core/Installer verified: $($launcher.Length) / $($core.Length) / $($installer.Length) bytes"

      - name: Upload desktop package
        uses: actions/upload-artifact@v6
        with:
          name: BOT-IA-Windows
          path: release/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
