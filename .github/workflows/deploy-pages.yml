name: Deploy WebApp to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "webapp/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate static WebApp
        shell: bash
        run: |
          test -f webapp/index.html
          test -f webapp/css/style.css
          test -f webapp/js/main.js
          test -f webapp/js/combat.js
          grep -q 'telegram-web-app.js' webapp/index.html
          node --check webapp/js/main.js
          node --check webapp/js/combat.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload WebApp artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "webapp"

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
