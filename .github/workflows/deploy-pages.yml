name: Deploy WebApp to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate static WebApp
        shell: bash
        run: |
          test -f webapp/index.html
          test -f webapp/css/style.css
          test -f webapp/js/main.js
          test -f webapp/js/combat.js
          test -f webapp/js/effects.js
          test -f webapp/js/api.js
          grep -q 'telegram-web-app.js' webapp/index.html
          grep -q 'class="crt-overlay"' webapp/index.html
          grep -q '#0a0a0a' webapp/css/style.css
          grep -q '#b026ff' webapp/css/style.css
          grep -q '#ff2a2a' webapp/css/style.css
          grep -q 'clip-path: polygon' webapp/css/style.css
          grep -q '@keyframes crt-flicker' webapp/css/style.css
          grep -q 'ctx.filter = ASSET_FILTER' webapp/js/combat.js
          grep -q 'Math.random() \* 10' webapp/js/combat.js
          grep -q 'HIT_FLASH_FRAMES = 3' webapp/js/combat.js
          grep -q 'LightweightCombatEffects' webapp/js/combat.js
          grep -q 'MAX_PARTICLES = 96' webapp/js/effects.js
          node --check webapp/js/main.js
          node --check webapp/js/combat.js
          node --check webapp/js/effects.js
          node --check webapp/js/api.js

      - name: Configure WebApp API endpoint
        shell: python
        env:
          TMA_API_BASE_URL: ${{ vars.TMA_API_BASE_URL }}
        run: |
          from pathlib import Path
          from urllib.parse import urlparse
          import os

          raw = os.environ.get("TMA_API_BASE_URL", "").strip().rstrip("/")
          if raw:
              parsed = urlparse(raw)
              if parsed.scheme != "https" or not parsed.netloc or parsed.query or parsed.fragment:
                  raise SystemExit("TMA_API_BASE_URL must be an absolute HTTPS URL without query or fragment")

          path = Path("webapp/index.html")
          text = path.read_text(encoding="utf-8")
          marker = '<meta name="waifumon-api-base-url" content="">'
          replacement = f'<meta name="waifumon-api-base-url" content="{raw}">'
          if marker not in text:
              raise SystemExit("TMA API meta tag was not found")
          path.write_text(text.replace(marker, replacement, 1), encoding="utf-8")

      - name: Copy production combat assets
        shell: bash
        run: |
          rm -rf webapp/assets/production
          mkdir -p webapp/assets
          cp -R assets/production webapp/assets/production

      - name: Verify configured API endpoint
        shell: python
        env:
          TMA_API_BASE_URL: ${{ vars.TMA_API_BASE_URL }}
        run: |
          from pathlib import Path
          import os

          configured = os.environ.get("TMA_API_BASE_URL", "").strip()
          if configured:
              html = Path("webapp/index.html").read_text(encoding="utf-8")
              expected = f'<meta name="waifumon-api-base-url" content="{configured.rstrip("/")}"">'
              if expected not in html:
                  raise SystemExit("Generated WebApp API endpoint does not match TMA_API_BASE_URL")
          else:
              print("TMA_API_BASE_URL is not configured; Pages artifact remains API-disconnected by design.")

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload WebApp artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "webapp"

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
