# -*- coding: utf-8 -*-
name: 2F-8T-J Qt lifetime blocker audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  qt-lifetime:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v6
        with:
          ref: diagnostic/2f-8t-qwebengine-clean
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"

      - name: Install Linux Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libglvnd0 \
            libx11-xcb1 \
            libxcb1 \
            libxcb-cursor0 \
            libxkbcommon0 \
            libxkbcommon-x11-0

      - name: Install runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "PySide6==6.11.2" \
            tzdata \
            playwright \
            python-dotenv \
            SQLAlchemy \
            pytest

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run complete suite with Qt lifetime probe
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          QT_LIFETIME_LOG="$PWD/artifacts/qt-lifetime.log" \
          python -m pytest -q -p diagnostics.pytest_qt_lifetime_probe \
            > artifacts/full-suite.log 2>&1
          code=$?
          echo "PYTEST_EXIT_CODE=$code" | tee -a artifacts/full-suite.log
          exit 0

      - name: Summarize transition evidence
        if: always()
        shell: python
        run: |
          from pathlib import Path

          path = Path("artifacts/qt-lifetime.log")
          if path.exists():
              print(path.read_text(encoding="utf-8", errors="replace"))
          else:
              print("NO_QT_LIFETIME_LOG")

      - name: Upload Qt lifetime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2f-8t-j-qt-lifetime
          path: artifacts/
          if-no-files-found: error
