name: CI

on:
  push:
    branches: [main, 'foundation/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Build and test Java WaifuMon engine
        run: mvn --batch-mode --no-transfer-progress -f engine/waifumon/pom.xml clean verify
      - name: Install Python
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Ruff
        run: ruff check app tests
      - name: Pytest
        run: pytest -q
