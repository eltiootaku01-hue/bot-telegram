name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.8"
      - name: Set up pinned uv installer
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.21"
          enable-cache: false
      - name: Record Python and installer versions
        run: |
          python --version
          uv --version
      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglvnd0 libx11-xcb1 libxcb1 libxcb-cursor0 libxkbcommon0 libxkbcommon-x11-0
      - name: Install locked runtime and test dependencies
        run: uv pip install --system --requirement requirements-ci.lock
      - name: Verify dependency lock against project and installed versions
        run: python scripts/check_ci_dependency_lock.py
      - name: Check installed dependency consistency
        run: uv pip check
      - name: Record installed dependency versions
        run: python -m pip freeze --all
      - name: Install Playwright Chromium (Linux)
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Install Playwright Chromium (Windows)
        if: runner.os == 'Windows'
        run: python -m playwright install chromium
      - name: Compile source and tests
        run: python -m compileall -q src tests launcher.py desktop.py desktop_entry.py
      - name: Run code policy checks
        env:
          POLICY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          POLICY_HEAD: ${{ github.sha }}
        run: python scripts/check_code_policy.py --git-range-env
      - name: Import runtime surface
        run: python -c "import bot_ia; import core.config; import bot_ia.runtime; import bot_ia.core.application; import bot_ia.core.local_workflow; import bot_ia.core.web_queue; import gui.task_orchestrator; import gui.gui_bridge; import bot_ia.interfaces.web; import bot_ia.interfaces.telegram_novel_v2; import launcher; import desktop_entry; import gui.app"
      - name: Run test suite
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: python -m pytest -q -vv
