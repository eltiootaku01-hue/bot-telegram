name: CI

on:
  push:
    branches: [main, 'foundation/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Resync Git LFS
        run: git lfs pull
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Build and test Java WaifuMon engine
        run: mvn --batch-mode --no-transfer-progress -f engine/waifumon/pom.xml clean verify
      - name: Install Python
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Build and test Java engine
        run: mvn -q -f engine/waifumon/pom.xml test package
      - name: Ruff
        run: ruff check app tests
      - name: Pytest
        run: pytest -q
      - name: Validate card assets
        run: python tools/validate_card_assets.py
      - name: Validate card visual QA
        run: python tools/validate_card_qa.py
      - name: Validate combat sprite contract
        run: python tools/validate_combat_sprites.py
      - name: Validate Telegram Mini App
        shell: bash
        run: |
          test -f webapp/index.html
          test -f webapp/css/style.css
          test -f webapp/js/main.js
          test -f webapp/js/combat.js
          grep -q 'telegram-web-app.js' webapp/index.html
          node --check webapp/js/main.js
          node --check webapp/js/combat.js
      - name: Export card art prompts
        run: python tools/export_card_art_prompts.py --output /tmp/WAIFUMON_CARD_ART_PROMPTS.md
      - name: Export sticker prompts
        run: python tools/export_sticker_prompts.py --output /tmp/STICKER_PROMPTS.md
      - name: Verify generated prompt artifacts are non-empty
        run: |
          test -s /tmp/WAIFUMON_CARD_ART_PROMPTS.md
          test -s /tmp/STICKER_PROMPTS.md
