name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build executables
        shell: cmd
        run: tools\build_launcher.bat
      - name: Verify executables
        shell: pwsh
        run: |
          $files = @(
            "dist\BotManager.exe",
            "dist\bots\Cari.exe",
            "dist\bots\Sunna.exe",
            "dist\bots\Cami.exe",
            "dist\bots\Chie.exe"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing executable: $file" }
          }
      - name: Build installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME -match '^v(.+)$') { $Matches[1] } else { '0.1.0' }
          New-Item -ItemType Directory -Force -Path dist-installer | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" installer\bot-telegram.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist-installer -Filter "BotTelegram-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer was not generated" }
          if ($installer.Length -lt 1MB) { throw "Installer looks unexpectedly small: $($installer.Length) bytes" }
          Write-Host "Installer: $($installer.FullName)"
      - name: Package portable build
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath bot-telegram-windows-portable.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: bot-telegram-windows-installer
          path: dist-installer\BotTelegram-Setup-*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bot-telegram-windows-portable
          path: bot-telegram-windows-portable.zip
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $installer = (Get-ChildItem dist-installer -Filter "BotTelegram-Setup-*.exe" | Select-Object -First 1).FullName
          gh release create "$env:GITHUB_REF_NAME" $installer bot-telegram-windows-portable.zip --generate-notes --title "Bot Telegram $env:GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
