name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller
      - name: Build executables
        shell: cmd
        run: tools\build_launcher.bat
      - name: Verify executables
        shell: pwsh
        run: |
          $files = @(
            "dist\BotManager.exe",
            "dist\bots\Cari.exe",
            "dist\bots\Sunna.exe",
            "dist\bots\Cami.exe",
            "dist\bots\Chie.exe"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing executable: $file" }
          }
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath bot-telegram-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: bot-telegram-windows
          path: bot-telegram-windows.zip
          if-no-files-found: error
