name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Resync Git LFS
        run: git lfs pull
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Build and test Java engine
        shell: pwsh
        run: mvn -q -f engine/waifumon/pom.xml test package
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller==6.22.2 pyinstaller-hooks-contrib==2026.7
      - name: Test native media and encoder core
        run: python -m pytest tests/test_native_media.py tests/test_media_manager.py tests/test_media_encoder.py
      - name: Validate card assets
        run: python tools/validate_card_assets.py
      - name: Validate combat sprite contract
        run: python tools/validate_combat_sprites.py
      - name: Validate card art prompt exporter
        shell: pwsh
        run: |
          python tools/export_card_art_prompts.py --output card-art-prompts.md
          if (-not (Test-Path "card-art-prompts.md")) { throw "Card art prompts were not exported" }
          if ((Get-Item "card-art-prompts.md").Length -le 0) { throw "Card art prompt export is empty" }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Resolve build version
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"$' | Select-Object -First 1
          if (-not $line) { throw "Could not resolve project version from pyproject.toml" }
          $version = $line.Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_NAME -match '^v(.+)$') {
            $tagVersion = $Matches[1]
            if ($tagVersion -ne $version) {
              throw "Tag version $tagVersion does not match pyproject.toml version $version"
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Build version: $version"
      - name: Build executables
        shell: cmd
        run: tools\build_launcher.bat
      - name: Verify visual assets
        shell: pwsh
        run: |
          if (-not (Test-Path "assets\production\cards")) {
            Write-Host "No approved production card assets are committed; runtime remains fail-closed."
            exit 0
          }
          $files = Get-ChildItem "assets\production\cards" -File -Recurse | Where-Object { $_.Extension -in @(".jpg", ".jpeg") }
          python tools\validate_card_assets.py

      - name: Validate committed production card assets
        shell: pwsh
        run: |
          if (Test-Path "assets\production\cards") {
            python tools\validate_card_assets.py
          } else {
            Write-Host "No approved production card assets are committed; runtime remains fail-closed."
          }
      - name: Verify Java WaifuMon runtime
        shell: pwsh
        run: |
          mvn --batch-mode --no-transfer-progress -f engine\waifumon\pom.xml verify
          $request = '{"contract_version":"1.0","request_id":"windows-smoke","correlation_id":"windows-smoke","player_id":1,"community_id":-100,"command":"gacha.roll","payload":{"seed":"windows-smoke"},"idempotency_key":"windows-smoke"}'
          $response = $request | & (Resolve-Path "dist\engine\jre\bin\java.exe") -jar (Resolve-Path "dist\engine\waifumon-engine.jar")
          if (-not $response) { throw "Java engine returned no response" }
          $decoded = $response | ConvertFrom-Json
          if (-not $decoded.success) { throw "Bundled Java engine rejected smoke request: $response" }
          if ($decoded.result_type -ne "gacha_roll") { throw "Unexpected result_type: $($decoded.result_type)" }

      - name: Verify executables
        shell: pwsh
        run: |
          $files = @(
            "dist\engine\waifumon-engine.jar",
            "dist\BotManager.exe",
            "dist\bots\Cari.exe",
            "dist\bots\Sunna.exe",
            "dist\bots\Cami.exe",
            "dist\bots\Chie.exe",
            "dist\bots\WorldBot.exe"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing executable: $file" }
            if ((Get-Item $file).Length -lt 100KB) { throw "Executable looks unexpectedly small: $file" }
          }

          if (-not (Test-Path "dist\engine\jre\bin\java.exe")) {
            throw "Bundled Java runtime executable is missing"
          }
          if (-not (Test-Path "dist\engine\jre\lib\modules")) {
            throw "Bundled Java runtime image is incomplete: lib\modules is missing"
          }
      - name: Smoke test BotManager
        shell: pwsh
        run: |
          $process = Start-Process -FilePath (Resolve-Path "dist\BotManager.exe") -WorkingDirectory (Resolve-Path "dist") -PassThru
          try {
            Start-Sleep -Seconds 8
            if ($process.HasExited) {
              throw "BotManager exited during the 8-second smoke window with code $($process.ExitCode)"
            }
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-installer | Out-Null
          $version = "${{ steps.version.outputs.version }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" installer\bot-telegram.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installer and create manifest
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist-installer -Filter "BotTelegram-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer was not generated" }
          if ($installer.Length -lt 1MB) { throw "Installer looks unexpectedly small: $($installer.Length) bytes" }
          $version = "${{ steps.version.outputs.version }}"
          if ($installer.BaseName -ne "BotTelegram-Setup-$version") {
            throw "Installer version mismatch: $($installer.Name) vs $version"
          }
          Write-Host "Installer: $($installer.FullName)"
      - name: Package portable build
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path dist\* -DestinationPath "BotTelegram-Windows-v$version-portable.zip" -Force
      - name: Generate checksums
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $installer = Get-ChildItem dist-installer -Filter "BotTelegram-Setup-$version.exe" | Select-Object -First 1
          $portable = Get-Item "BotTelegram-Windows-v$version-portable.zip"
          $lines = @(
            "SHA256 checksums for Bot Telegram $version",
            "",
            "$(Get-FileHash $installer.FullName -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  $($installer.Name)",
            "$(Get-FileHash $portable.FullName -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  $($portable.Name)"
          )
          $lines | Set-Content -Path "SHA256SUMS.txt" -Encoding utf8
      - uses: actions/upload-artifact@v6
        with:
          name: bot-telegram-windows-installer
          path: |
            dist-installer\BotTelegram-Setup-*.exe
            SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: bot-telegram-windows-portable
          path: |
            BotTelegram-Windows-v*-portable.zip
            SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $installer = (Get-ChildItem dist-installer -Filter "BotTelegram-Setup-$version.exe" | Select-Object -First 1).FullName
          $portable = (Get-Item "BotTelegram-Windows-v$version-portable.zip").FullName
          gh release create "$env:GITHUB_REF_NAME" $installer $portable SHA256SUMS.txt --generate-notes --title "Bot Telegram $env:GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
