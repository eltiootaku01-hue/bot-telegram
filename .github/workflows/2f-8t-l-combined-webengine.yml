# -*- coding: utf-8 -*-
name: 2F-8T-L combined WebEngine lifecycle isolation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  combined:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --headless --disable-gpu --disable-software-rasterizer
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v6
        with:
          ref: diagnostic/2f-8t-qwebengine-clean
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"

      - name: Install Linux Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libglvnd0 \
            libx11-xcb1 \
            libxcb1 \
            libxcb-cursor0 \
            libxkbcommon0 \
            libxkbcommon-x11-0

      - name: Install runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "PySide6==6.11.2" \
            tzdata \
            playwright \
            python-dotenv \
            SQLAlchemy \
            pytest

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run combined WebEngine context
        run: |
          python -m pytest -q -vv \
            tests/test_cross_route_physical_resource_exclusivity.py \
            tests/test_physical_lifecycle_reconciliation.py \
            tests/test_production_runtime_lifecycle_8s.py \
            tests/test_webchat_runtime_controlled_8h.py
