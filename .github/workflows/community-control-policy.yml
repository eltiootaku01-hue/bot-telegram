name: Community control isolated gate

on:
  push:
    branches:
      - feat/dual-platform-cerebro-architecture-2026-10-21
    paths:
      - src/bot_ia/core/community_control.py
      - tests/test_community_control.py
      - tests/test_personality_contract_document.py
      - docs/architecture/PERSONALITY_CONTRACT_V1.md
      - .github/workflows/community-control-policy.yml

permissions:
  contents: read

jobs:
  community-control-policy:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Check Python code policy for isolated files
        run: python scripts/check_code_policy.py src/bot_ia/core/community_control.py tests/test_community_control.py tests/test_personality_contract_document.py
      - name: Run community controller unit tests
        run: python -m pytest -q tests/test_community_control.py
      - name: Validate personality contract document
        run: python tests/test_personality_contract_document.py -v
