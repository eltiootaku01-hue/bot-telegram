# -*- coding: utf-8 -*-
name: 2F-8T-E minimal QWebEngine probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  qwebengine-probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v6
        with:
          ref: diagnostic/2f-8t-qwebengine-clean
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"

      - name: Install historical Linux Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             libegl1             libgl1             libglvnd0             libx11-xcb1             libxcb1             libxcb-cursor0             libxkbcommon0             libxkbcommon-x11-0

      - name: Install exact probe dependency
        run: |
          python -m pip install --disable-pip-version-check "PySide6==6.11.2"

      - name: Capture baseline environment
        run: |
          mkdir -p artifacts
          {
            echo "=== RUNNER ==="
            uname -a
            cat /etc/os-release
            echo "=== PYTHON ==="
            python --version
            python -c "import PySide6; from PySide6.QtCore import qVersion; from PySide6.QtWebEngineCore import qWebEngineChromiumVersion; print('PySide6='+PySide6.__version__); print('Qt='+qVersion()); print('QtWebEngine/Chromium='+qWebEngineChromiumVersion())"
            echo "=== RELEVANT ENVIRONMENT ==="
            env | grep -E '^(QT_QPA_PLATFORM|QTWEBENGINE_CHROMIUM_FLAGS|QTWEBENGINEPROCESS_PATH|QT_LOGGING_RULES|QT_DEBUG_PLUGINS|DISPLAY|WAYLAND_DISPLAY|XDG_SESSION_TYPE)=' || true
            echo "=== INSTALLED QT WHEELS ==="
            python -m pip show PySide6 PySide6_Addons PySide6_Essentials shiboken6
          } | tee artifacts/context.txt

      - name: Run exact historical harness configuration
        shell: bash
        run: |
          set +e
          for n in 1 2 3 4 5; do
            echo "===== RUN $n =====" | tee "artifacts/run-$n.log"
            env -u QT_QPA_PLATFORM -u QTWEBENGINE_CHROMIUM_FLAGS -u QTWEBENGINEPROCESS_PATH \
              -u QT_LOGGING_RULES -u QT_DEBUG_PLUGINS -u DISPLAY -u WAYLAND_DISPLAY -u XDG_SESSION_TYPE \
              QT_QPA_PLATFORM="offscreen" \
              QTWEBENGINE_CHROMIUM_FLAGS="--headless --disable-gpu --disable-software-rasterizer" \
              python diagnostics/qwebengine_probe_minimal.py >>"artifacts/run-$n.log" 2>&1
            code=$?
            echo "PROCESS_EXIT_CODE=$code" >>"artifacts/run-$n.log"
            echo "run=$n exit=$code"
          done

      - name: Build result summary
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import re

          lines = []
          for n in range(1, 6):
              text = Path(f"artifacts/run-{n}.log").read_text(errors="replace")
              load = re.findall(r"^LOAD_FINISHED=(.+)$", text, re.M)
              elapsed = re.findall(r"^ELAPSED_MS=(.+)$", text, re.M)
              code = re.findall(r"^PROCESS_EXIT_CODE=(.+)$", text, re.M)
              lines.append(
                  f"RUN_{n}: "
                  f"LOAD_FINISHED={load[-1] if load else 'MISSING'} "
                  f"ELAPSED_MS={elapsed[-1] if elapsed else 'MISSING'} "
                  f"PROCESS_EXIT_CODE={code[-1] if code else 'MISSING'}"
              )
          Path("artifacts/summary.txt").write_text("\n".join(lines) + "\n")
          print("\n".join(lines))

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2f-8t-e-qwebengine-probe
          path: artifacts/
          if-no-files-found: error

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2f-8t-g-historical-qwebengine-probe
          path: artifacts/
          if-no-files-found: error
