[project]
name = "community-telegram-bot"
version = "0.1.0"
description = "Modular Telegram community bot with an API-sparing AI brain"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.28,<4.0",
  "pydantic-settings>=2.10,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "aiosqlite>=0.21,<1.0",
  "python-dotenv>=1.2,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.2,<2.0",
  "ruff>=0.13,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100
lint.select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
