[project]
name = "bot-ia"
version = "1.0.0"
description = "BOT-IA Knowledge Engine and multi-interface personal bot"
requires-python = ">=3.14"
dependencies = ["tzdata"]

[project.scripts]
bot-ia = "bot_ia.__main__:main"

[tool.bot_ia]
phase = "production-runtime"
network = true

[tool.pytest.ini_options]
testpaths = ["tests"]
