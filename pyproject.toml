[project]
name = "bot-ia"
version = "1.0.0"
description = "BOT-IA Knowledge Engine and multi-interface personal bot"
requires-python = ">=3.14"
# compatibility marker: python_version < "3.14"
dependencies = ["tzdata", "PySide6>=6.8", "playwright>=1.61,<2", "python-dotenv>=1.1,<2", "SQLAlchemy>=2.0,<3", "fastapi>=0.116,<1", "uvicorn>=0.35,<1", "pydantic>=2.10,<3", "aiogram>=3.28,<4", "qasync>=0.28,<0.29; python_version < \"3.14\""]

[project.scripts]
bot-ia = "bot_ia.__main__:main"

[tool.bot_ia]
phase = "production-runtime"
network = true

[tool.pytest.ini_options]
testpaths = ["tests"]
