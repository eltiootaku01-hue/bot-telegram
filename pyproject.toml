[project]
name = "community-telegram-bot"
version = "0.1.0"
description = "Modular Telegram community bot with an API-sparing AI brain"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.28,<4.0",
  "pydantic-settings>=2.10,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "aiosqlite>=0.21,<1.0",
  "python-dotenv>=1.2,<2.0",
  "aiohttp>=3.14,<4.0",
  "psutil>=7.0,<8.0",
  "Pillow>=11.0,<13.0",
  "tzdata>=2026.1,<2027.0",
]

[project.scripts]
community-telegram-multibot = "app.multibot.main:main"
card-vault = "app.card_vault.server:main"
bot-manager = "app.launcher:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.2,<2.0",
  "ruff>=0.13,<1.0",
]
assets = [
  "Pillow>=11,<13",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100
lint.select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
