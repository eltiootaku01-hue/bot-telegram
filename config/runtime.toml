# Remote providers are the normal runtime path.
# Credentials stay outside Git in environment variables / .env.

[providers.openai]
enabled = true
model = "gpt-5.6-luna"
max_output_tokens = 512
timeout_seconds = 45.0
fallback = "groq"

[providers.openai.accounts.openai_main]
secret_env = "OPENAI_API_KEY"
priority = 10
cooldown_seconds = 60.0

# Add more OpenAI API keys here without changing application code.
# [providers.openai.accounts.openai_alt]
# secret_env = "OPENAI_API_KEY_ALT"
# priority = 20
# cooldown_seconds = 60.0

[providers.groq]
enabled = true
model = "openai/gpt-oss-20b"
max_output_tokens = 512
timeout_seconds = 30.0
fallback = "coze"

[providers.groq.accounts.groq_main]
secret_env = "GROQ_API_KEY"
priority = 10
cooldown_seconds = 30.0

# Coze is an agent/API provider rather than a normal model endpoint.
# COZE_BOT_ID identifies the published Coze bot/agent used by this account.
[providers.coze]
enabled = false
model = "coze-bot"
max_output_tokens = 512
timeout_seconds = 60.0
fallback = ""
base_url = "https://api.coze.com"

[providers.coze.accounts.coze_main]
secret_env = "COZE_API_TOKEN"
priority = 10
cooldown_seconds = 60.0

# Optional local fallback only. Disabled by default to avoid unnecessary RAM/CPU use.
# If enabled, use the lightweight Qwen 3 1B model only.
[providers.ollama]
enabled = false
model = "qwen3:1b"
max_output_tokens = 256
timeout_seconds = 60.0
fallback = ""

[services.supabase]
enabled = false
url = ""

[services.telegram]
enabled = false

[universes.one_neko_punch]
display_name = "One Neko Punch"
root_path = "env:BOT_IA_ONE_NEKO_PUNCH_ROOT"
spoiler_policy = "strict"
language = "es"
