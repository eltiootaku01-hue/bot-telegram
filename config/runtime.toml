# Remote providers are the normal runtime path.
# Credentials stay outside Git in environment variables / .env.

[providers.openai]
enabled = true
model = "gpt-5.6-luna"
max_output_tokens = 512
timeout_seconds = 45.0
fallback = "groq"

[providers.openai.accounts.openai_main]
secret_env = "OPENAI_API_KEY"
priority = 10
cooldown_seconds = 60.0

[providers.groq]
enabled = true
model = "openai/gpt-oss-20b"
max_output_tokens = 512
timeout_seconds = 30.0
fallback = "openrouter"

[providers.groq.accounts.groq_main]
secret_env = "GROQ_API_KEY"
priority = 10
cooldown_seconds = 30.0

[providers.openrouter]
enabled = true
model = "openai/gpt-oss-20b"
max_output_tokens = 512
timeout_seconds = 30.0
fallback = "coze"
base_url = "https://openrouter.ai/api/v1"

[providers.openrouter.accounts.openrouter_main]
secret_env = "OPENROUTER_API_KEY"
priority = 10
cooldown_seconds = 30.0

[providers.coze]
enabled = false
model = "coze-bot"
max_output_tokens = 512
timeout_seconds = 60.0
fallback = ""
base_url = "https://api.coze.com"

[providers.coze.accounts.coze_main]
secret_env = "COZE_API_TOKEN"
priority = 10
cooldown_seconds = 60.0

# Ollama remains disabled in the base profile so installing/configuring BOT-IA
# never starts or constructs a local model implicitly. The Windows launcher
# sets BOT_IA_ENABLE_LOCAL_OLLAMA=true only after the user explicitly selects
# "Ollama local". That activation is still on-demand; the adapter sends
# keep_alive=0 and never starts the Ollama service itself.
[providers.ollama]
enabled = false
model = "qwen3:1.7b-q4_K_M"
max_output_tokens = 256
timeout_seconds = 90.0
fallback = ""

[services.supabase]
enabled = false
url = ""

[services.telegram]
enabled = false

[universes.one_neko_punch]
display_name = "One Neko Punch"
root_path = "env:BOT_IA_ONE_NEKO_PUNCH_ROOT"
reference_universe_id = "one_punch_man"
reference_display_name = "One-Punch Man"
spoiler_policy = "strict"
language = "es"

