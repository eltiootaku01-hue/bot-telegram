# Remote providers are the normal runtime path.
# Credentials stay outside Git in environment variables / .env.

[providers.gemini]
enabled = true
model = "gemini-3.8-flash"
max_output_tokens = 256
timeout_seconds = 30.0
fallback = "openai"

[providers.openai]
enabled = false
model = "gpt-5.6-luna"
max_output_tokens = 256
timeout_seconds = 30.0
fallback = ""

# Optional local fallback only. Disabled by default to avoid unnecessary RAM/CPU use.
# If enabled, use the lightweight Qwen 3 1B model only.
[providers.ollama]
enabled = false
model = "qwen3:1b"
max_output_tokens = 256
timeout_seconds = 60.0
fallback = ""

[services.supabase]
enabled = false
url = ""

[services.telegram]
enabled = false

[universes.one_neko_punch]
display_name = "One Neko Punch"
root_path = "env:BOT_IA_ONE_NEKO_PUNCH_ROOT"
spoiler_policy = "strict"
language = "es"
