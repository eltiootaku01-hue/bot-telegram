# Non-secret Web physical identity declarations.
# These aliases declare the intended principal/session only; they do not prove
# provider authentication and remain UNKNOWN until runtime evidence exists.
[web_identities.cari_gemini]
provider = "gemini"
principal_identity = "declared-web-principal-cari"
provider_session_identity = "declared-web-session-cari"
canonical_interaction_surface = "https://gemini.google.com/app/"
browser_profile = "./browser_data/cari"
authentication_state = "UNKNOWN"

[web_identities.cami_gemini]
provider = "gemini"
principal_identity = "declared-web-principal-cami"
provider_session_identity = "declared-web-session-cami"
canonical_interaction_surface = "https://gemini.google.com/app/"
browser_profile = "./browser_data/cami"
authentication_state = "UNKNOWN"

[web_identities.sunna_gemini]
provider = "gemini"
principal_identity = "declared-web-principal-sunna"
provider_session_identity = "declared-web-session-sunna"
canonical_interaction_surface = "https://gemini.google.com/app/"
browser_profile = "./browser_data/sunna"
authentication_state = "UNKNOWN"

[web_identities.chie_gemini]
provider = "gemini"
principal_identity = "declared-web-principal-chie"
provider_session_identity = "declared-web-session-chie"
canonical_interaction_surface = "https://gemini.google.com/app/"
browser_profile = "./browser_data/chie"
authentication_state = "UNKNOWN"

[web_identity_bindings.cari_gemini]
logical_actor = "cari"
identity_id = "cari_gemini"

[web_identity_bindings.cami_gemini]
logical_actor = "cami"
